[build]
  command = "npm run build"
  publish = "build"
  
  [build.environment]
    NODE_VERSION = "16"  # Match your local Node.js version
    NPM_FLAGS = "--legacy-peer-deps"  # Helps with dependency resolution

# Required for Single Page Applications (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://eaglevisionedge.com/.netlify/functions/ https://*.google-analytics.com;"

# Development settings
[dev]
  command = "npm start"
  port = 3000
  publish = "build"
  targetPort = 3000
