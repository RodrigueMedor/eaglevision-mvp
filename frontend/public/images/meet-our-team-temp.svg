<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Temporary image placeholder for Meet Our Team">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Decorative blobs -->
  <g opacity="0.12">
    <circle cx="1100" cy="80" r="160" fill="#fff"/>
    <circle cx="80" cy="520" r="140" fill="#fff"/>
  </g>

  <!-- Title -->
  <g transform="translate(100,120)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Meet Our Team</text>
    <text x="0" y="42" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#e0f2fe">A passionate group focused on your success</text>
  </g>

  <!-- Team avatar cards -->
  <g transform="translate(100,220)" filter="url(#shadow)">
    <!-- Card 1 -->
    <g>
      <rect x="0" y="0" rx="16" ry="16" width="310" height="180" fill="#ffffff" opacity="0.95"/>
      <circle cx="72" cy="72" r="40" fill="#e2e8f0"/>
      <text x="55" y="80" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#334155">EV</text>
      <text x="130" y="68" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Lead Consultant</text>
      <text x="130" y="96" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#475569">Tax Strategy & Advisory</text>
      <rect x="130" y="120" rx="8" ry="8" width="140" height="32" fill="#eff6ff"/>
      <text x="146" y="141" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1d4ed8">Book a consultation</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(340,0)">
      <rect x="0" y="0" rx="16" ry="16" width="310" height="180" fill="#ffffff" opacity="0.95"/>
      <circle cx="72" cy="72" r="40" fill="#e2e8f0"/>
      <text x="54" y="80" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#334155">FD</text>
      <text x="130" y="68" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Financial Analyst</text>
      <text x="130" y="96" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#475569">Planning & Forecasting</text>
      <rect x="130" y="120" rx="8" ry="8" width="120" height="32" fill="#eff6ff"/>
      <text x="146" y="141" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1d4ed8">View expertise</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(680,0)">
      <rect x="0" y="0" rx="16" ry="16" width="310" height="180" fill="#ffffff" opacity="0.95"/>
      <circle cx="72" cy="72" r="40" fill="#e2e8f0"/>
      <text x="54" y="80" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#334155">CS</text>
      <text x="130" y="68" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Client Success</text>
      <text x="130" y="96" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#475569">Experience & Support</text>
      <rect x="130" y="120" rx="8" ry="8" width="140" height="32" fill="#eff6ff"/>
      <text x="146" y="141" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1d4ed8">Contact our team</text>
    </g>
  </g>

  <!-- Footer badge -->
  <g transform="translate(100,520)" opacity="0.9">
    <rect x="0" y="-28" rx="14" ry="14" width="310" height="44" fill="#0b5ed7" opacity="0.25"/>
    <text x="16" y="0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#e0f2fe">Temporary placeholder — replace with real team photos</text>
  </g>
</svg>
