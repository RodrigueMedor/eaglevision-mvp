[build]
command = "cd frontend && npm install && npm run build && cd ../backend && npm install"
publish = "frontend/build"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "18"
NPM_FLAGS = "--legacy-peer-deps --force"

[dev]
command = "cd frontend && npm start"
port = 3000
targetPort = 3000
publish = "frontend/build"

# API redirects
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

# GraphQL endpoint
[[redirects]]
from = "/graphql"
to = "/.netlify/functions/graphql"
status = 200
force = true

# Health check endpoint
[[redirects]]
from = "/health"
to = "/.netlify/functions/graphql/health"
status = 200

# Test endpoint
[[redirects]]
from = "/test"
to = "/.netlify/functions/graphql/test"
status = 200

# SPA fallback (must be last)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[functions]
node_bundler = "esbuild"
external_node_modules = ["firebase-admin", "@apollo/server", "express", "cors", "serverless-http"]

[functions.graphql]
node_bundler = "esbuild"
external_node_modules = ["firebase-admin", "@apollo/server", "express", "cors", "serverless-http"]

# Security headers
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "same-origin"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://eaglevisionedge.com/.netlify/functions/ https://*.google-analytics.com;"