[build]
  command = "npm install && cd frontend && npm install && npm run build"
  publish = "frontend/build"

[dev]
  # Run the React app on port 3000
  port = 3000
  # Proxy API requests to the backend on port 3001
  targetPort = 3001
  # Auto-launch the site in your browser
  autoLaunch = true

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps --force"
  NPM_VERBOSE = "true"

# Functions configuration
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "graphql-scalars", "lodash", "graphql-type-json"]
  included_files = ["node_modules/graphql-type-json/**", "node_modules/@graphql-tools/**"]
  node_bundler = "esbuild"
  
[functions.graphql]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "graphql-scalars", "lodash", "graphql-type-json"]
  included_files = [
    "node_modules/graphql-type-json/**",
    "node_modules/@graphql-tools/**",
    "node_modules/graphql/**"
  ]

# Configure secrets scanning
[build.processing]
  skip_processing = false

# Ignore false positives in secret scanning
[build.processing.secrets_scan]
  enabled = true
  skip_paths = [
    "**/node_modules/**",
    "**/.git/**",
    "**/venv/**",
    "**/__pycache__/**",
    "**/*.log",
    "**/build/**",
    "**/dist/**",
    "**/package-lock.json",
    "**/yarn.lock",
    "**/README.md",
    "**/*.pyc"
  ]

# Environment variables for build
[context.production.environment]
  APP_ENV = "production"
  REACT_APP_API_URL = "https://api.eaglevisionedge.com"
  REACT_APP_GA_TRACKING_ID = ""

[context.deploy-preview.environment]
  APP_ENV = "staging"
  REACT_APP_API_URL = "https://staging-api.eaglevisionedge.com"

[context.develop]
  command = "cd frontend && npm start"
  publish = "frontend/build"
  target_port = 3000

# API redirects
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

# GraphQL endpoint
[[redirects]]
from = "/graphql"
to = "/.netlify/functions/graphql"
status = 200
force = true

# Redirect all traffic to www and HTTPS
[[redirects]]
from = "/*"
to = "/:splat"
status = 200
conditions = {Host = ["eaglevisionedge.com"]}

[[redirects]]
from = "/*"
to = "https://www.eaglevisionedge.com/:splat"
status = 301
conditions = {Host = ["eaglevisionedge.com"]}

# Health check endpoint
[[redirects]]
from = "/health"
to = "/.netlify/functions/graphql/health"
status = 200

# Test endpoint
[[redirects]]
from = "/test"
to = "/.netlify/functions/graphql/test"
status = 200

# SPA fallback (must be last)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://*.docusign.net;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: https: https://*.docusign.net;
      font-src 'self' data: https:;
      connect-src 'self' https://eaglevisionedge.com/.netlify/functions/ https://*.google-analytics.com https://*.docusign.net https://*.docusign.com;
      frame-ancestors 'none';
    """
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"