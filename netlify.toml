[build]
  command = "cd frontend && npm install && CI=false npm run build && cd ../netlify/functions && npm install"
  publish = "frontend/build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps --force"
  
  # DocuSign Environment Variables
  DOCUSIGN_ACCOUNT_ID = "${env:DOCUSIGN_ACCOUNT_ID}"
  DOCUSIGN_INTEGRATION_KEY = "${env:DOCUSIGN_INTEGRATION_KEY}"
  DOCUSIGN_USER_ID = "${env:DOCUSIGN_USER_ID}"
  DOCUSIGN_BASE_PATH = "${env:DOCUSIGN_BASE_PATH}"
  DOCUSIGN_PRIVATE_KEY = "${env:DOCUSIGN_PRIVATE_KEY}"
  DOCUSIGN_RETURN_URL = "https://eaglevisionedge.com/appointments"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "graphql-scalars", "lodash"]
  included_files = ["../backend/config/firebase/**"]

[dev]
  command = "cd frontend && npm start"
  port = 3000
  targetPort = 3000
  publish = "frontend/build"

# API redirects
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

# GraphQL endpoint
[[redirects]]
from = "/graphql"
to = "/.netlify/functions/graphql"
status = 200
force = true

# Redirect all traffic to www and HTTPS
[[redirects]]
from = "/*"
to = "/:splat"
status = 200
conditions = {Host = ["eaglevisionedge.com"]}

[[redirects]]
from = "/*"
to = "https://www.eaglevisionedge.com/:splat"
status = 301
conditions = {Host = ["eaglevisionedge.com"]}

# Health check endpoint
[[redirects]]
from = "/health"
to = "/.netlify/functions/graphql/health"
status = 200

# Test endpoint
[[redirects]]
from = "/test"
to = "/.netlify/functions/graphql/test"
status = 200

# SPA fallback (must be last)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://*.docusign.net;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: https: https://*.docusign.net;
      font-src 'self' data: https:;
      connect-src 'self' https://eaglevisionedge.com/.netlify/functions/ https://*.google-analytics.com https://*.docusign.net https://*.docusign.com;
      frame-ancestors 'none';
    """
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"