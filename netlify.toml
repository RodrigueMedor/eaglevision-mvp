[build]
command = "cd backend && npm install && npm run build"
publish = "backend/build"
functions = "backend/netlify/functions"

[build.environment]
NODE_VERSION = "16"
NPM_FLAGS = "--prefix backend"

# API redirects
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

# GraphQL endpoint
[[redirects]]
from = "/graphql"
to = "/.netlify/functions/graphql"
status = 200

# Function redirects
[[redirects]]
from = "/.netlify/functions/graphql/*"
to = "/.netlify/functions/graphql"
status = 200

# SPA fallback (must be last)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[functions]
node_bundler = "esbuild"
external_node_modules = ["firebase-admin"]

# Function configuration
[functions.graphql]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# Required for server-side routing
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"