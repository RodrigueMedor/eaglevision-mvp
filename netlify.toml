[build]
command = "cd backend && npm install && npm run build"
publish = "backend/build"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "16"
NPM_FLAGS = "--prefix backend"

# API redirects
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

# GraphQL endpoint
[[redirects]]
from = "/graphql"
to = "/.netlify/functions/graphql"
status = 200
force = true

# Health check endpoint
[[redirects]]
from = "/health"
to = "/.netlify/functions/graphql/health"
status = 200

# Test endpoint
[[redirects]]
from = "/test"
to = "/.netlify/functions/graphql/test"
status = 200

# SPA fallback (must be last)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[functions]
node_bundler = "esbuild"
external_node_modules = ["firebase-admin"]

[functions.graphql]
node_bundler = "esbuild"
external_node_modules = ["firebase-admin"]

# Security headers
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "same-origin"