[build]
  command = "npm install && npm run build"
  publish = "build"
  functions = "netlify/functions"

[dev]
  framework = "#custom"
  command = "npm run start"
  targetPort = 4000
  target = "http://localhost:4000"
  publish = "build"
  port = 8888
  autoLaunch = true

# Install function dependencies
[[plugins]]
  package = "@netlify/plugin-functions"

# Ensure Netlify installs dependencies declared for Functions
[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "jsonwebtoken", "bcryptjs"]
  included_files = ["node_modules/**"]
  
  [functions.graphql]
    node_bundler = "esbuild"
    timeout = 30  # seconds
    node_version = "18"
    external_node_modules = ["firebase-admin", "jsonwebtoken", "bcryptjs"]
    included_files = ["node_modules/**"]

# API Routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Email Verification Endpoints
[[redirects]]
  from = "/api/send-verification-email"
  to = "/.netlify/functions/send-verification-email"
  status = 200

[[redirects]]
  from = "/api/verify-email"
  to = "/.netlify/functions/verify-email"
  status = 200

# GraphQL Endpoint
[[redirects]]
  from = "/graphql"
  to = "/.netlify/functions/graphql"
  status = 200

# Health check endpoint
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/graphql/health"
  status = 200

# Handle all other API requests
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
