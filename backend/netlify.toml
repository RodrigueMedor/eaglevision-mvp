[build]
  command = "cd backend && npm install && npm run build"
  publish = "backend/build"
  functions = "backend/netlify/functions"

[dev]
  framework = "#custom"
  command = "cd backend && npm run start"
  targetPort = 4000
  target = "http://localhost:4000"
  publish = "backend/build"
  port = 8888
  autoLaunch = true

[functions]
  node_bundler = "esbuild"
  # Only externalize modules that should not be bundled
  external_node_modules = ["firebase-admin"]
  
  included_files = [
    "backend/node_modules/**",
    "backend/src/**/*.js"
  ]
  
  [functions.graphql]
    node_bundler = "esbuild"
    timeout = 30  # seconds
    node_version = "18"  # Use Node.js 18 LTS
    included_files = [
      "backend/node_modules/**",
      "backend/src/**/*.js"
    ]

# API Routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Email Verification Endpoints
[[redirects]]
  from = "/api/send-verification-email"
  to = "/.netlify/functions/send-verification-email"
  status = 200

[[redirects]]
  from = "/api/verify-email"
  to = "/.netlify/functions/verify-email"
  status = 200

# GraphQL Endpoint
[[redirects]]
  from = "/graphql"
  to = "/.netlify/functions/graphql"
  status = 200

# Health check endpoint
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/graphql/health"
  status = 200

# Handle all other API requests
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
